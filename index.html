<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>MindMatch Memory Game</title>
  <meta name="description" content="A vivid, progressive memory game">
  <link rel="stylesheet prefetch" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
  <link rel="stylesheet prefetch" href="https://fonts.googleapis.com/css?family=Poppins:400,600,800">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
</head>

<body>

  <div class="controls-bar">
    <button id="theme-toggle"><i class="fa fa-moon-o"></i> Dark Mode</button>
  </div>

  <div class="container">
    <header>
      <h1>MindMatch</h1>
      <h2 id="level-title">Level 1 (4x4)</h2>
    </header>

    <section class="score-panel">
      <ul class="stars">
        <li><i class="fa fa-star"></i></li>
        <li><i class="fa fa-star"></i></li>
        <li><i class="fa fa-star"></i></li>
      </ul>

      <span class="moves">0</span> Moves
      <span class="timer">0 mins 0 secs</span>
      <div class="restart" title="Restart Level">
        <i class="fa fa-repeat"></i>
      </div>
    </section>

    <ul class="deck" id="deck">
      <!-- Cards generated dynamically -->
    </ul>
  </div>

  <div class="modal-background hide">
    <div class="modal-body">
      <div class="modal-head">
        <h1 id="modal-heading">LEVEL COMPLETE!!!</h1>
        <div class="modal-result">
          <p>Time = <span id="modal-time"></span></p>
          <p>Stars = <span id="modal-stars"></span></p>
          <p>Moves = <span id="modal-moves"></span></p>
        </div>
        <div class="modal-buttons">
          <button onclick="document.location.reload(true)">Restart Game</button>
          <button id="next-level-btn">Next Level</button>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
